  <script>
    // Apply the saved theme before the stylesheet is displayed to avoid a theme flash.
    try {
      const savedSettings = JSON.parse(localStorage.getItem("jkdPortfolioSettings"));
      if (savedSettings && savedSettings.theme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    } catch (error) {
      // If storage is empty or invalid, the page keeps the default light theme.
    }
  </script>

</head>

<section id="contact" class="section-contact section-pad"><div class="section-heading"><h1>Contact Me</h1><p>For inquiries and commissions, kindly fill out this form.</p></div><form id="contact-form" class="contact-form" novalidate><div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" autocomplete="name" required><small class="field-error" id="name-error"></small></div><div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" autocomplete="email" required><small class="field-error" id="email-error"></small></div><div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="5" required></textarea><small class="field-error" id="message-error"></small></div><button class="submit-btn" type="submit">Validate Message</button><p id="form-status" class="form-status" role="status" aria-live="polite"></p></form><p class="contact-info">Email: <a href="mailto:jameskeithdoligol@gmail.com">jameskeithdoligol@gmail.com</a></p><div class="social-links"><a href="https://www.facebook.com/james.keith.39566" target="_blank" rel="noopener noreferrer"><img src="assets/facebook-icon.jpg" alt="Facebook"></a><a href="https://www.instagram.com/jk.dlgl/" target="_blank" rel="noopener noreferrer"><img src="assets/instagram-icon.jpg" alt="Instagram"></a><a href="https://www.linkedin.com/in/james-keith-doligol-5690b4381/" target="_blank" rel="noopener noreferrer"><img src="assets/linkedin-icon.jpg" alt="LinkedIn"></a></div></section>
