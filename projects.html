<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="JKD Designs personal portfolio">
  <title>Projects | JKD Designs</title>
  <script>
    // Apply the saved theme before the stylesheet is displayed to avoid a theme flash.
    try {
      const savedSettings = JSON.parse(localStorage.getItem("jkdPortfolioSettings"));
      if (savedSettings && savedSettings.theme === "dark") {
        document.documentElement.classList.add("dark-mode");
      }
    } catch (error) {
      // If storage is empty or invalid, the page keeps the default light theme.
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html" aria-label="JKD Designs home">JKD Designs<span>.</span></a>
  <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">Menu</button>
  <button class="theme-toggle" id="dark-mode-btn" type="button" aria-pressed="false">Dark Mode</button>
  <nav class="navbar" id="nav-menu" aria-label="Main navigation">
    <a href="index.html#home">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#skills">Skills</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
<main>
<section id="projects" class="section-projects section-pad"><div class="section-heading"><h1>My Projects</h1></div><div class="projects-grid" id="project-container" aria-live="polite"></div></section>
</main>
<footer class="site-footer">
  <a href="index.html" class="footer-logo">JKD Designs<span>.</span></a>
  <p>&copy; 2026 JKD Designs. All rights reserved.</p>
</footer>
<script src="js/storage.js"></script>
<script src="js/script.js"></script>
</body>
</html>
